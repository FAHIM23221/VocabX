<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>অ্যাডমিন প্যানেল — VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --primary-green: #12A150;
    --dark-green: #0B3D2E;
    --light-green: #E8F5E9;
    --bg-color: #F4F0E2;
    --card-bg: #FFFFFF;
    --text-main: #17281F;
    --text-muted: #5C6D62;
    --border-color: rgba(20, 40, 30, 0.14);
  }

  body {
    background-color: var(--bg-color);
    font-family: 'Hind Siliguri', sans-serif;
    color: var(--text-main);
  }

  .admin-wrap {
    padding: 30px 20px 60px;
    max-width: 800px;
    margin: 0 auto;
  }

  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    background: var(--card-bg);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
    border: 1px solid var(--border-color);
  }

  .admin-title-area h1 {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    color: var(--dark-green);
    margin: 0 0 5px 0;
  }
  .admin-title-area h1 span {
    color: var(--primary-green);
  }
  .admin-title-area p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .admin-user-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .admin-email {
    font-size: 0.9rem;
    color: var(--text-muted);
    background: var(--light-green);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(18, 161, 80, 0.2);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
    text-align: center;
    transition: transform 0.2s;
  }
  .stat-card:hover {
    transform: translateY(-5px);
  }
  .stat-card h3 {
    margin: 0 0 10px;
    font-size: 1.1rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .stat-card .num {
    font-family: 'Fraunces', serif;
    font-size: 3rem;
    color: var(--primary-green);
    font-weight: 600;
    line-height: 1;
  }

  .user-list-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
    overflow: hidden;
  }

  .user-list-header {
    padding: 20px 24px;
    background: rgba(20, 40, 30, 0.02);
    border-bottom: 1px solid var(--border-color);
  }
  .user-list-header h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--dark-green);
  }

  .user-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
    transition: background 0.2s;
  }
  .user-row:hover {
    background: rgba(20, 40, 30, 0.02);
  }
  .user-row:last-child {
    border-bottom: none;
  }
  
  .user-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary-green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
  }
  
  .user-details {
    display: flex;
    flex-direction: column;
  }
  .user-row .uname {
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-main);
  }
  .user-row .uemail {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  
  .role-tag {
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 999px;
    background: #f1f3f4;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .role-tag.admin {
    background: var(--dark-green);
    color: #fff;
  }
  
  .empty-note {
    color: var(--text-muted);
    font-size: 1rem;
    text-align: center;
    padding: 40px 0;
  }
  
  .logout-btn-admin {
    background: none;
    border: 1px solid var(--border-color);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .logout-btn-admin:hover {
    background: #ffebee;
    color: #c62828;
    border-color: #ffcdd2;
  }

  @media (max-width: 600px) {
    .admin-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
    }
    .admin-user-info {
      width: 100%;
      justify-content: space-between;
    }
    .user-row {
      padding: 12px 16px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div class="admin-wrap">
    
    <div class="admin-header">
      <div class="admin-title-area">
        <h1>Vocab<span>X</span></h1>
        <p>অ্যাডমিন কন্ট্রোল প্যানেল</p>
      </div>
      <div class="admin-user-info">
        <span class="admin-email" id="adminEmailTag">...</span>
        <button class="logout-btn-admin" id="logoutBtn" title="লগআউট">⎋</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>মোট ইউজার</h3>
        <div class="num" id="totalUsers">০</div>
      </div>
      <!-- Add more stat cards here in future if needed (e.g. Pro Users, Active Today) -->
    </div>

    <div class="user-list-card" id="userListCard">
      <div class="user-list-header">
        <h3>সব ইউজার</h3>
      </div>
      <div id="userList">
        <p class="empty-note">লোড হচ্ছে...</p>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = "login.html";
    return;
  }
  const snap = await getDoc(doc(db, "users", user.uid));
  const role = snap.exists() ? snap.data().role : "user";
  if (role !== "admin"){
    // অ্যাডমিন না হলে এখানে থাকার অনুমতি নেই
    window.location.href = "index.html";
    return;
  }
  document.getElementById("adminEmailTag").textContent = user.email;
  loadUsers();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});

async function loadUsers(){
  const snap = await getDocs(collection(db, "users"));
  const listEl = document.getElementById("userList");
  document.getElementById("totalUsers").textContent = toBn(snap.size);

  if (snap.empty){
    listEl.innerHTML = '<p class="empty-note">কোনো ইউজার নেই</p>';
    return;
  }

  listEl.innerHTML = "";
  snap.forEach(d => {
    const u = d.data();
    const name = u.name || "নাম নেই";
    const initial = name.trim().charAt(0).toUpperCase();
    const row = document.createElement("div");
    row.className = "user-row";
    row.innerHTML = `
      <div class="user-info">
        <div class="user-avatar">${initial}</div>
        <div class="user-details">
          <div class="uname">${escapeHtml(name)}</div>
          <div class="uemail">${escapeHtml(u.email || "")}</div>
        </div>
      </div>
      <span class="role-tag ${u.role === 'admin' ? 'admin' : ''}">${u.role === 'admin' ? 'অ্যাডমিন' : 'ইউজার'}</span>
    `;
    listEl.appendChild(row);
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function toBn(n){
  const digits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  return String(n).split("").map(c => /[0-9]/.test(c) ? digits[c] : c).join("");
}
</script>
</body>
</html>
