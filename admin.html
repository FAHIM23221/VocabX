<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>অ্যাডমিন প্যানেল — VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  if ((localStorage.getItem("vocabx_theme") || "light") === "dark"){
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
<style>
  :root {
    --primary-green: #12A150;
    --dark-green: #0B3D2E;
    --light-green: #E8F5E9;
    --bg-color: #F4F0E2;
    --card-bg: #FFFFFF;
    --text-main: #17281F;
    --text-muted: #5C6D62;
    --border-color: rgba(20, 40, 30, 0.14);
    --tag-bg: #f1f3f4;
    --radius: 18px;
  }
  [data-theme="dark"] {
    --primary-green: #1BB865;
    --dark-green: #35E683;
    --light-green: rgba(27, 184, 101, 0.14);
    --bg-color: #0E1911;
    --card-bg: #17261C;
    --text-main: #EAF3EC;
    --text-muted: #93A99B;
    --border-color: rgba(255, 255, 255, 0.12);
    --tag-bg: rgba(255, 255, 255, 0.08);
  }

  *{ box-sizing:border-box; }
  body {
    margin:0;
    background-color: var(--bg-color);
    font-family: 'Hind Siliguri', sans-serif;
    color: var(--text-main);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .admin-wrap {
    padding: 30px 20px 60px;
    max-width: 800px;
    margin: 0 auto;
  }

  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    background: var(--card-bg);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
    border: 1px solid var(--border-color);
  }

  .admin-title-area h1 {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    color: var(--dark-green);
    margin: 0 0 5px 0;
    display: flex;
    align-items: baseline;
    gap: 1px;
  }
  .admin-title-area h1 img {
    height: 0.7em;
    width: auto;
    transform: translateY(0.08em);
  }
  .admin-title-area p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .admin-user-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .admin-email {
    font-size: 0.9rem;
    color: var(--text-muted);
    background: var(--light-green);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(18, 161, 80, 0.2);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
    text-align: center;
    transition: transform 0.2s;
  }
  .stat-card:hover {
    transform: translateY(-5px);
  }
  .stat-card h3 {
    margin: 0 0 10px;
    font-size: 1.1rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .stat-card .num {
    font-family: 'Fraunces', serif;
    font-size: 3rem;
    color: var(--primary-green);
    font-weight: 600;
    line-height: 1;
  }

  .user-list-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
    overflow: hidden;
  }

  .user-list-header {
    padding: 20px 24px;
    background: rgba(20, 40, 30, 0.02);
    border-bottom: 1px solid var(--border-color);
  }
  .user-list-header h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--dark-green);
  }

  .user-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
    transition: background 0.2s;
  }
  .user-row:hover {
    background: rgba(20, 40, 30, 0.02);
  }
  .user-row:last-child {
    border-bottom: none;
  }
  
  .user-info {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary-green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
  }
  
  .user-details {
    display: flex;
    flex-direction: column;
  }
  .user-row .uname {
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-main);
  }
  .user-row .uemail {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  
  .role-tag {
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .role-tag.admin {
    background: var(--dark-green);
    color: #fff;
  }
  .role-tag.main-admin {
    background: linear-gradient(135deg, #C9A227, #E9C25B);
    color: #3B2E00;
  }
  .role-tag.banned {
    background: #FDEAEA;
    color: #C0392B;
  }
  [data-theme="dark"] .role-tag.banned {
    background: rgba(192, 57, 43, 0.2);
    color: #FF8A80;
  }

  .row-right {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }
  .row-actions {
    display: flex; gap: 6px;
  }
  .mini-btn {
    font-size: 0.72rem; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border-color); background: var(--card-bg);
    color: var(--text-muted); cursor: pointer; white-space: nowrap;
  }
  .mini-btn.danger { color: #C0392B; border-color: rgba(192,57,43,0.3); }
  .mini-btn.promote { color: var(--primary-green); border-color: rgba(18,161,80,0.3); }

  .add-admin-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(11, 61, 46, 0.05);
  }
  .add-admin-card h3 {
    margin: 0 0 12px; font-size: 1rem; color: var(--dark-green); font-family:'Fraunces', serif;
  }
  .add-admin-row { display: flex; gap: 10px; }
  .add-admin-row input {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--border-color); background: var(--bg-color);
    font-family: 'Hind Siliguri', sans-serif; font-size: 0.92rem; color: var(--text-main);
  }
  .add-admin-row button {
    padding: 10px 18px; border-radius: 10px; border: none;
    background: var(--dark-green); color: #fff; font-weight: 600; cursor: pointer;
    font-family: 'Hind Siliguri', sans-serif; white-space: nowrap;
  }
  .add-admin-note { font-size: 0.78rem; color: var(--text-muted); margin: 10px 0 0; min-height: 1.2em; }
  
  .empty-note {
    color: var(--text-muted);
    font-size: 1rem;
    text-align: center;
    padding: 40px 0;
  }
  
  .logout-btn-admin {
    background: none;
    border: 1px solid var(--border-color);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .logout-btn-admin:hover {
    background: #ffebee;
    color: #c62828;
    border-color: #ffcdd2;
  }
  .theme-toggle-admin {
    background: none;
    border: 1px solid var(--border-color);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }

  @media (max-width: 600px) {
    .admin-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
    }
    .admin-user-info {
      width: 100%;
      justify-content: space-between;
    }
    .user-row {
      padding: 12px 16px;
    }
  }
</style>
</head>
<body>

<div class="admin-wrap">

  <div class="admin-header">
    <div class="admin-title-area">
      <h1>Vocab<img src="logo-mark.png" alt="X"></h1>
      <p>অ্যাডমিন কন্ট্রোল প্যানেল</p>
    </div>
    <div class="admin-user-info">
      <span class="admin-email" id="adminEmailTag">...</span>
      <button class="theme-toggle-admin" id="themeToggle" title="থিম বদলাও">🌙</button>
      <button class="logout-btn-admin" id="logoutBtn" title="লগআউট">⎋</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h3>মোট ইউজার</h3>
      <div class="num" id="totalUsers">০</div>
    </div>
    <!-- Add more stat cards here in future if needed (e.g. Pro Users, Active Today) -->
  </div>

  <div class="add-admin-card" id="addAdminCard" style="display:none;">
    <h3>নতুন অ্যাডমিন যোগ করো</h3>
    <div class="add-admin-row">
      <input type="email" id="newAdminEmail" placeholder="ইউজারের ইমেইল লিখো">
      <button id="makeAdminBtn">অ্যাডমিন বানাও</button>
    </div>
    <p class="add-admin-note" id="addAdminNote">যাকে অ্যাডমিন বানাতে চাও তাকে আগে VocabX-এ সাইনআপ করতে হবে।</p>
  </div>

  <div class="user-list-card" id="userListCard">
    <div class="user-list-header">
      <h3>সব ইউজার</h3>
    </div>
    <div id="userList">
      <p class="empty-note">লোড হচ্ছে...</p>
    </div>
  </div>

</div>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("vocabx_theme") || "light";
    const btn = document.getElementById("themeToggle");
    btn.textContent = saved === "dark" ? "☀️" : "🌙";
    btn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      if (isDark){
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("vocabx_theme", "light");
        btn.textContent = "🌙";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("vocabx_theme", "dark");
        btn.textContent = "☀️";
      }
    });
  });
</script>


<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  doc, getDoc, updateDoc, collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const MAIN_ADMIN_EMAIL = "fahim360k@gmail.com";
let currentUserEmail = "";
let isMainAdmin = false;

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = "login.html";
    return;
  }
  const snap = await getDoc(doc(db, "users", user.uid));
  const data = snap.exists() ? snap.data() : {};

  if (data.banned){
    await signOut(auth);
    alert("তোমার অ্যাকাউন্ট নিষিদ্ধ করা হয়েছে।");
    window.location.href = "login.html";
    return;
  }

  const role = data.role || "user";
  currentUserEmail = user.email;
  isMainAdmin = (user.email === MAIN_ADMIN_EMAIL);

  if (role !== "admin" && !isMainAdmin){
    // অ্যাডমিন না হলে এখানে থাকার অনুমতি নেই
    window.location.href = "index.html";
    return;
  }

  document.getElementById("adminEmailTag").textContent = user.email;
  if (isMainAdmin){
    document.getElementById("addAdminCard").style.display = "block";
  }
  loadUsers();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});

/* ---- promote by email (main admin only — also enforced by Firestore rules) ---- */
document.getElementById("makeAdminBtn").addEventListener("click", async () => {
  const noteEl = document.getElementById("addAdminNote");
  const email = document.getElementById("newAdminEmail").value.trim();
  if (!email){
    noteEl.textContent = "আগে একটা ইমেইল লিখো।";
    noteEl.style.color = "#C0392B";
    return;
  }
  noteEl.textContent = "খোঁজা হচ্ছে...";
  noteEl.style.color = "";
  try{
    const q = query(collection(db, "users"), where("email", "==", email));
    const snap = await getDocs(q);
    if (snap.empty){
      noteEl.textContent = "এই ইমেইলে কোনো ইউজার পাওয়া যায়নি — আগে তাকে সাইনআপ করতে হবে।";
      noteEl.style.color = "#C0392B";
      return;
    }
    const targetDoc = snap.docs[0];
    await updateDoc(doc(db, "users", targetDoc.id), { role: "admin" });
    noteEl.textContent = `${email} এখন অ্যাডমিন হয়ে গেছে।`;
    noteEl.style.color = "var(--primary-green)";
    document.getElementById("newAdminEmail").value = "";
    loadUsers();
  }catch(err){
    noteEl.textContent = "সমস্যা হয়েছে: " + (err.code || err.message);
    noteEl.style.color = "#C0392B";
  }
});

async function loadUsers(){
  const snap = await getDocs(collection(db, "users"));
  const listEl = document.getElementById("userList");
  document.getElementById("totalUsers").textContent = toBn(snap.size);

  if (snap.empty){
    listEl.innerHTML = '<p class="empty-note">কোনো ইউজার নেই</p>';
    return;
  }

  listEl.innerHTML = "";
  snap.forEach(d => {
    const u = d.data();
    const uid = d.id;
    const name = u.name || "নাম নেই";
    const initial = name.trim().charAt(0).toUpperCase();
    const targetIsMainAdmin = (u.email === MAIN_ADMIN_EMAIL);
    const isAdminRow = u.role === "admin";

    let roleTagHtml;
    if (targetIsMainAdmin){
      roleTagHtml = `<span class="role-tag main-admin">👑 মূল অ্যাডমিন</span>`;
    } else if (isAdminRow){
      roleTagHtml = `<span class="role-tag admin">অ্যাডমিন</span>`;
    } else {
      roleTagHtml = `<span class="role-tag">ইউজার</span>`;
    }
    const bannedTagHtml = u.banned ? `<span class="role-tag banned">ব্যানড</span>` : "";

    let actionsHtml = "";
    if (!targetIsMainAdmin){
      const buttons = [];
      if (isMainAdmin){
        buttons.push(isAdminRow
          ? `<button class="mini-btn danger" data-action="demote" data-uid="${uid}">অ্যাডমিন সরাও</button>`
          : `<button class="mini-btn promote" data-action="promote" data-uid="${uid}">অ্যাডমিন বানাও</button>`);
      }
      // মূল অ্যাডমিন এবং সাধারণ অ্যাডমিন উভয়ই ব্যান/আনব্যান করতে পারবে,
      // কিন্তু অ্যাডমিন আরেকজন অ্যাডমিনকে ব্যান করতে পারবে না — শুধু মূল অ্যাডমিন পারবে
      if (isMainAdmin || !isAdminRow){
        buttons.push(u.banned
          ? `<button class="mini-btn promote" data-action="unban" data-uid="${uid}">আনব্যান করো</button>`
          : `<button class="mini-btn danger" data-action="ban" data-uid="${uid}">ব্যান করো</button>`);
      }
      actionsHtml = `<div class="row-actions">${buttons.join("")}</div>`;
    }

    const row = document.createElement("div");
    row.className = "user-row";
    row.innerHTML = `
      <div class="user-info">
        <div class="user-avatar">${initial}</div>
        <div class="user-details">
          <div class="uname">${escapeHtml(name)}</div>
          <div class="uemail">${escapeHtml(u.email || "")}</div>
        </div>
      </div>
      <div class="row-right">
        ${roleTagHtml}
        ${bannedTagHtml}
        ${actionsHtml}
      </div>
    `;
    listEl.appendChild(row);
  });
}

/* ---- row action buttons (event delegation) ---- */
document.getElementById("userList").addEventListener("click", async (e) => {
  const btn = e.target.closest(".mini-btn");
  if (!btn) return;
  const uid = btn.dataset.uid;
  const action = btn.dataset.action;
  btn.disabled = true;

  try{
    if (action === "promote") await updateDoc(doc(db, "users", uid), { role: "admin" });
    if (action === "demote") await updateDoc(doc(db, "users", uid), { role: "user" });
    if (action === "ban") await updateDoc(doc(db, "users", uid), { banned: true });
    if (action === "unban") await updateDoc(doc(db, "users", uid), { banned: false });
    loadUsers();
  }catch(err){
    alert("সমস্যা হয়েছে: " + (err.code || err.message));
    btn.disabled = false;
  }
});

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function toBn(n){
  const digits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  return String(n).split("").map(c => /[0-9]/.test(c) ? digits[c] : c).join("");
}
</script>
</body>
</html>
