<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>বুকমার্ক — VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  if ((localStorage.getItem("vocabx_theme") || "light") === "dark"){
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
<style>
  .back-link{ display:inline-flex; align-items:center; gap:6px; color: var(--ink-soft); text-decoration:none; font-size:0.9rem; }
  .bm-wrap{ padding: 22px 20px 30px; }
  .bm-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .bm-title{ font-family:'Fraunces', serif; font-size:1.4rem; font-weight:700; margin:0 0 16px; }
  .bm-item{
    background: var(--surface); border-radius:16px; padding:14px 16px; margin-bottom:12px;
    display:flex; align-items:center; gap:12px; box-shadow: 0 2px 8px rgba(20,40,30,.05);
  }
  .bm-item .info{ flex:1; min-width:0; }
  .bm-item .w{ font-family:'Fraunces', serif; font-weight:700; font-size:1.25rem; }
  .bm-item .m{ color: var(--ink-soft); font-size:1.02rem; margin-top:2px; }
  .bm-item .e{ color: var(--ink-soft); font-size:.82rem; margin-top:4px; font-style:italic; }
  .round-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background: var(--paper-deep);
    cursor:pointer; font-size:1rem; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  }
  .bm-empty{ text-align:center; color: var(--ink-soft); padding:50px 20px; line-height:1.7; }
</style>
</head>
<body>

<div class="app">
  <div class="bm-wrap">
    <div class="bm-head">
      <a href="profile.html" class="back-link" style="margin-bottom:0;">← ফিরে যাও</a>
      <button class="theme-toggle-btn" id="themeToggleBtn" title="থিম বদলাও">🌙</button>
    </div>
    <h1 class="bm-title">বুকমার্ক করা শব্দ</h1>
    <div id="bmList"><p class="bm-empty">লোড হচ্ছে...</p></div>
  </div>
</div>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("vocabx_theme") || "light";
    const btn = document.getElementById("themeToggleBtn");
    btn.textContent = saved === "dark" ? "☀️" : "🌙";
    btn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      if (isDark){
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("vocabx_theme", "light");
        btn.textContent = "🌙";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("vocabx_theme", "dark");
        btn.textContent = "☀️";
      }
    });
  });
</script>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { speak } from "./sounds.js";

let uid = null, WORDS = [], bookmarks = [];

onAuthStateChanged(auth, async (user) => {
  if (!user){ window.location.href = "login.html"; return; }
  const us = await getDoc(doc(db, "users", user.uid));
  if (us.exists() && us.data().banned){
    await signOut(auth);
    alert("তোমার অ্যাকাউন্ট নিষিদ্ধ (ব্যান) করা হয়েছে।");
    window.location.href = "login.html";
    return;
  }
  uid = user.uid;
  const res = await fetch("words.json");
  WORDS = await res.json();
  const ps = await getDoc(doc(db, "users", uid, "progress", "data"));
  bookmarks = ps.exists() && Array.isArray(ps.data().bookmarks) ? ps.data().bookmarks : [];
  render();
});

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(){
  const list = document.getElementById("bmList");
  const items = bookmarks.map(id => WORDS.find(w => w.id === id)).filter(Boolean);
  if (!items.length){
    list.innerHTML = `<p class="bm-empty">এখনো কোনো শব্দ বুকমার্ক করা হয়নি।<br>লেসনে শব্দের নিচের বুকমার্ক বাটনে চাপলে এখানে জমা হবে।</p>`;
    return;
  }
  list.innerHTML = items.map(w => `
    <div class="bm-item">
      <div class="info">
        <div class="w">${esc(w.word)}</div>
        <div class="m">${esc(w.bn)}</div>
        ${w.example ? `<div class="e">${esc(w.example)}</div>` : ""}
      </div>
      <button class="round-btn" data-say="${esc(w.word)}" aria-label="উচ্চারণ শোনো">🔊</button>
      <button class="round-btn" data-remove="${w.id}" aria-label="বুকমার্ক সরাও">✕</button>
    </div>`).join("");
}

document.getElementById("bmList").addEventListener("click", async (e) => {
  const say = e.target.closest("[data-say]");
  if (say){ speak(say.dataset.say, "en-US"); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm){
    const id = Number(rm.dataset.remove);
    bookmarks = bookmarks.filter(x => x !== id);
    render();
    try{ await setDoc(doc(db, "users", uid, "progress", "data"), { bookmarks }, { merge: true }); }catch(err){ console.error(err); }
  }
});
</script>
</body>
</html>
