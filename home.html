<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>হোম — VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand-lockup">Vocab<img src="logo-mark.png" alt="X"></div>
    <div class="stats">
      <a href="profile.html" class="stat logout-btn" title="প্রোফাইল">👤</a>
    </div>
  </header>

  <div class="home-wrap">
    <div class="notice-banner is-hidden" id="noticeBanner">
      <span class="bell">🔔</span>
      <span id="noticeTextStatic"></span>
      <span class="marquee-track" id="noticeTextMarquee" style="display:none;"></span>
    </div>

    <div class="home-greet">
      <div>
        <h1 id="greetName">Hi, ...</h1>
        <p>আজকের প্র্যাকটিস শুরু করে ফেলো!</p>
      </div>
      <div class="home-badges">
        <span class="streak-pill" id="streakPill">🔥 ০</span>
      </div>
    </div>

    <div class="home-hero">
      <p class="eyebrow">আজকের প্র্যাকটিস</p>
      <h2>নতুন শব্দ শেখো, পুরনোগুলো ঝালিয়ে নাও</h2>
      <a href="index.html" class="cta-btn">শুরু করো →</a>
    </div>

    <div class="home-stats">
      <div class="home-stat-card">
        <h3>শব্দ</h3>
        <div class="stat-line" id="wordStatLine">লোড হচ্ছে...</div>
        <div class="home-progress-track"><div class="home-progress-fill" id="wordProgressFill" style="width:0%"></div></div>
      </div>
      <div class="home-stat-card soon">
        <h3>বাক্য</h3>
        <div class="stat-line">শীঘ্রই আসছে</div>
        <div class="home-progress-track"><div class="home-progress-fill" style="width:0%; background: var(--line);"></div></div>
      </div>
    </div>

    <div class="home-premium">
      <h3>প্রিমিয়াম আনলক করো</h3>
      <p>সম্পূর্ণ শব্দভাণ্ডার ও ফিচার আনলক করতে যোগাযোগ করো।</p>
      <button id="premiumBtn">বিস্তারিত জানো</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item is-active"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span>হোম</a>
    <a href="index.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>শব্দ</a>
    <a href="sentences.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>বাক্য</a>
    <a href="profile.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>প্রোগ্রেস</a>
  </nav>
</div>

<div class="popup-notice-overlay is-hidden" id="popupNoticeOverlay">
  <div class="popup-notice-card">
    <div class="icon">📢</div>
    <h3 id="popupNoticeTitle">নোটিশ</h3>
    <p id="popupNoticeText"></p>
    <button id="popupNoticeCloseBtn">বুঝেছি</button>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const MASTERED_AT = 4;

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = "login.html";
    return;
  }
  const snap = await getDoc(doc(db, "users", user.uid));
  const data = snap.exists() ? snap.data() : {};

  if (data.banned){
    await signOut(auth);
    alert("তোমার অ্যাকাউন্ট নিষিদ্ধ (ব্যান) করা হয়েছে।");
    window.location.href = "login.html";
    return;
  }

  document.getElementById("greetName").textContent = "Hi, " + (data.name || "বন্ধু").split(" ")[0];
  loadStats(user.uid);
  loadNotice();
  loadPopupNotice();
});

async function loadNotice(){
  try{
    const snap = await getDoc(doc(db, "notices", "current"));
    if (snap.exists() && snap.data().active && snap.data().message){
      const banner = document.getElementById("noticeBanner");
      const msg = snap.data().message;
      if (snap.data().animated){
        banner.classList.add("is-animated");
        document.getElementById("noticeTextStatic").style.display = "none";
        const track = document.getElementById("noticeTextMarquee");
        track.style.display = "inline-block";
        track.textContent = msg;
      } else {
        banner.classList.remove("is-animated");
        document.getElementById("noticeTextStatic").style.display = "";
        document.getElementById("noticeTextStatic").textContent = msg;
        document.getElementById("noticeTextMarquee").style.display = "none";
      }
      banner.classList.remove("is-hidden");
    }
  }catch(e){ /* নোটিশ না থাকলে চুপচাপ এড়িয়ে যাও */ }
}

async function loadPopupNotice(){
  try{
    const snap = await getDoc(doc(db, "notices", "popup"));
    if (snap.exists() && snap.data().active && snap.data().message){
      document.getElementById("popupNoticeTitle").textContent = snap.data().title || "নোটিশ";
      document.getElementById("popupNoticeText").textContent = snap.data().message;
      document.getElementById("popupNoticeOverlay").classList.remove("is-hidden");
    }
  }catch(e){ /* পপ-আপ নোটিশ না থাকলে চুপচাপ এড়িয়ে যাও */ }
}
document.getElementById("popupNoticeCloseBtn").addEventListener("click", () => {
  document.getElementById("popupNoticeOverlay").classList.add("is-hidden");
});

document.getElementById("premiumBtn").addEventListener("click", () => {
  alert("প্রিমিয়াম সাবস্ক্রিপশন সিস্টেম শীঘ্রই আসছে।");
});

async function loadStats(uid){
  const progSnap = await getDoc(doc(db, "users", uid, "progress", "data"));
  const prog = progSnap.exists() ? progSnap.data() : { strength: {}, streak: 0 };

  document.getElementById("streakPill").textContent = "🔥 " + toBn(prog.streak || 0);

  try{
    const res = await fetch("words.json");
    const words = await res.json();
    const mastered = words.filter(w => (prog.strength?.[String(w.id)] || 0) >= MASTERED_AT).length;
    const pct = words.length ? Math.round((mastered / words.length) * 100) : 0;
    document.getElementById("wordStatLine").textContent = `${toBn(mastered)} / ${toBn(words.length)} শেখা হয়েছে`;
    document.getElementById("wordProgressFill").style.width = pct + "%";
  }catch(e){
    document.getElementById("wordStatLine").textContent = "—";
  }
}

function toBn(n){
  const digits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  return String(n).split("").map(c => /[0-9]/.test(c) ? digits[c] : c).join("");
}
</script>
</body>
</html>
