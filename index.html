<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand-lockup">Vocab<img src="logo-mark.png" alt="X"></div>
    <div class="stats">
      <span class="stat streak" id="streakStat">🔥 ০</span>
      <span class="stat count" id="countStat">০ / ০</span>
      <a href="profile.html" class="stat logout-btn" title="প্রোফাইল">👤</a>
      <button class="stat logout-btn" id="logoutBtn" title="লগআউট">⎋</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-mode="flash">ফ্ল্যাশকার্ড</button>
    <button class="tab" data-mode="quiz">কুইজ</button>
  </nav>

  <main class="stage">

    <!-- FLASHCARD MODE -->
    <section class="view" id="flashView">
      <div class="deckline" id="flashProgress">শব্দ ১ / ২০</div>

      <div class="card-wrap">
        <button class="navbtn prev" id="flashPrev" aria-label="আগের শব্দ">‹</button>

        <div class="flashcard" id="flashcard">
          <div class="flashcard-inner">
            <div class="face front">
              <span class="pos" id="frontPos">verb</span>
              <span class="word" id="frontWord">word</span>
              <span class="pron" id="frontPron">উচ্চারণ</span>
              <span class="tap-hint">অর্থ দেখতে ট্যাপ করো</span>
            </div>
            <div class="face back">
              <span class="bn" id="backBn">অর্থ</span>
              <span class="example" id="backExample">example sentence</span>
              <div class="strength-dots" id="strengthDots"></div>
            </div>
          </div>
        </div>

        <button class="navbtn next" id="flashNext" aria-label="পরের শব্দ">›</button>
      </div>

      <div class="know-row">
        <button class="know-btn dont" id="btnDontKnow">জানি না</button>
        <button class="know-btn know" id="btnKnow">জানি ✓</button>
      </div>
    </section>

    <!-- QUIZ MODE -->
    <section class="view is-hidden" id="quizView">
      <div class="deckline" id="quizProgress">প্রশ্ন ১ / ২০</div>

      <div class="quiz-card">
        <p class="quiz-q">নিচের শব্দটির বাংলা অর্থ কি?</p>
        <p class="quiz-word" id="quizWord">word</p>

        <ul class="options" id="quizOptions"></ul>

        <p class="quiz-feedback" id="quizFeedback"></p>
      </div>

      <button class="primary-btn" id="quizNextBtn">পরের প্রশ্ন →</button>
    </section>

    <!-- END OF DECK -->
    <section class="view is-hidden" id="doneView">
      <div class="done-card">
        <p class="done-title">এই সেটটি শেষ হয়েছে</p>
        <p class="done-sub">তুমি <span id="doneScore">০</span> টি শব্দ ঠিক বলেছো</p>
        <button class="primary-btn" id="restartBtn">আবার শুরু করো</button>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span>হোম</a>
    <a href="index.html" class="nav-item is-active"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>শব্দ</a>
    <a href="sentences.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>বাক্য</a>
    <a href="profile.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>প্রোগ্রেস</a>
  </nav>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
