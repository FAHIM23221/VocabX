<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>শব্দ মিলকরণ — VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  if ((localStorage.getItem("vocabx_theme") || "light") === "dark"){
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand-lockup">Vocab<img src="logo-mark.png" alt="X"></div>
    <div class="stats">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="থিম বদলাও">🌙</button>
      <a href="profile.html" class="stat logout-btn" title="প্রোফাইল">👤</a>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <a class="tab" href="index.html">ফ্ল্যাশকার্ড</a>
    <a class="tab" href="index.html">কুইজ</a>
    <button class="tab is-active" data-mode="match">মিলকরণ</button>
  </nav>

  <main class="match-wrap">
    <p class="match-progress" id="matchProgress">০ / ৫ মিলেছে</p>

    <div class="match-columns">
      <div class="match-col" id="leftCol"></div>
      <div class="match-col" id="rightCol"></div>
    </div>

    <p class="match-status" id="matchStatus">বাম আর ডান থেকে একটা করে শব্দ বেছে নাও</p>
    <button class="match-next-btn" id="matchNextBtn" disabled>এগিয়ে যাও →</button>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span>হোম</a>
    <a href="index.html" class="nav-item is-active"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>শব্দ</a>
    <a href="sentences.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>বাক্য</a>
    <a href="profile.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>প্রোগ্রেস</a>
  </nav>
</div>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("vocabx_theme") || "light";
    const btn = document.getElementById("themeToggleBtn");
    btn.textContent = saved === "dark" ? "☀️" : "🌙";
    btn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      if (isDark){
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("vocabx_theme", "light");
        btn.textContent = "🌙";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("vocabx_theme", "dark");
        btn.textContent = "☀️";
      }
    });
  });
</script>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ROUND_SIZE = 5;
let ALL_WORDS = [];
let round = []; // [{id, word, bn}]
let selectedLeft = null;
let selectedRight = null;
let matched = new Set();
let lockInput = false;

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = "login.html";
    return;
  }
  const snap = await getDoc(doc(db, "users", user.uid));
  if (snap.exists() && snap.data().banned){
    await signOut(auth);
    alert("তোমার অ্যাকাউন্ট নিষিদ্ধ (ব্যান) করা হয়েছে।");
    window.location.href = "login.html";
    return;
  }
  init();
});

async function init(){
  const res = await fetch("words.json");
  ALL_WORDS = await res.json();
  startRound();
}

function startRound(){
  matched = new Set();
  selectedLeft = null;
  selectedRight = null;
  lockInput = false;

  const pool = [...ALL_WORDS].sort(() => Math.random() - 0.5);
  round = pool.slice(0, Math.min(ROUND_SIZE, pool.length));

  renderBoard();
  updateProgress();
  setStatus("বাম আর ডান থেকে একটা করে শব্দ বেছে নাও");
  document.getElementById("matchNextBtn").disabled = true;
  document.getElementById("matchNextBtn").textContent = "এগিয়ে যাও →";
}

function renderBoard(){
  const leftOrder = [...round].sort(() => Math.random() - 0.5);
  const rightOrder = [...round].sort(() => Math.random() - 0.5);

  const leftCol = document.getElementById("leftCol");
  const rightCol = document.getElementById("rightCol");
  leftCol.innerHTML = "";
  rightCol.innerHTML = "";

  leftOrder.forEach(w => {
    const card = document.createElement("div");
    card.className = "match-card";
    card.textContent = w.word;
    card.dataset.id = w.id;
    card.dataset.side = "left";
    card.addEventListener("click", () => onCardClick("left", w.id, card));
    leftCol.appendChild(card);
  });

  rightOrder.forEach(w => {
    const card = document.createElement("div");
    card.className = "match-card";
    card.textContent = w.bn;
    card.dataset.id = w.id;
    card.dataset.side = "right";
    card.addEventListener("click", () => onCardClick("right", w.id, card));
    rightCol.appendChild(card);
  });
}

function cardsFor(id){
  return document.querySelectorAll(`.match-card[data-id="${id}"]`);
}

function onCardClick(side, id, el){
  if (lockInput || matched.has(id)) return;

  if (side === "left"){
    if (selectedLeft === id){
      selectedLeft = null;
      el.classList.remove("selected");
      return;
    }
    document.querySelectorAll('.match-card[data-side="left"]').forEach(c => c.classList.remove("selected"));
    selectedLeft = id;
    el.classList.add("selected");
  } else {
    if (selectedRight === id){
      selectedRight = null;
      el.classList.remove("selected");
      return;
    }
    document.querySelectorAll('.match-card[data-side="right"]').forEach(c => c.classList.remove("selected"));
    selectedRight = id;
    el.classList.add("selected");
  }

  if (selectedLeft !== null && selectedRight !== null){
    evaluateMatch();
  }
}

function evaluateMatch(){
  const l = selectedLeft, r = selectedRight;
  if (l === r){
    matched.add(l);
    document.querySelectorAll('.match-card[data-side="left"].selected, .match-card[data-side="right"].selected').forEach(c => {
      c.classList.remove("selected");
      c.classList.add("correct");
    });
    selectedLeft = null;
    selectedRight = null;
    updateProgress();
    if (matched.size === round.length){
      setStatus("দারুন! সবগুলো মিলিয়ে ফেলেছো 🎉");
      document.getElementById("matchNextBtn").disabled = false;
      document.getElementById("matchNextBtn").textContent = "আবার খেলো →";
    } else {
      setStatus("দারুন হয়েছে! পরেরটা করো");
    }
  } else {
    lockInput = true;
    document.querySelectorAll('.match-card[data-side="left"].selected, .match-card[data-side="right"].selected').forEach(c => {
      c.classList.add("wrong");
    });
    setStatus("মিলেনি, আবার চেষ্টা করো");
    setTimeout(() => {
      document.querySelectorAll(".match-card.wrong").forEach(c => {
        c.classList.remove("wrong");
        c.classList.remove("selected");
      });
      selectedLeft = null;
      selectedRight = null;
      lockInput = false;
      if (matched.size < round.length){
        setStatus("বাম আর ডান থেকে একটা করে শব্দ বেছে নাও");
      }
    }, 700);
  }
}

function updateProgress(){
  document.getElementById("matchProgress").textContent = `${toBn(matched.size)} / ${toBn(round.length)} মিলেছে`;
}

function setStatus(text){
  document.getElementById("matchStatus").textContent = text;
}

document.getElementById("matchNextBtn").addEventListener("click", () => {
  if (document.getElementById("matchNextBtn").disabled) return;
  startRound();
});

function toBn(n){
  const digits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  return String(n).split("").map(c => /[0-9]/.test(c) ? digits[c] : c).join("");
}
</script>
</body>
</html>
