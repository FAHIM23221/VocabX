<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<title>প্রোফাইল — VocabX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .profile-wrap{ padding: 24px 20px 40px; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft);
    text-decoration:none; font-size:0.9rem; margin-bottom:18px;
  }
  .id-card{
    background:var(--surface); border:1.5px solid var(--ink); border-radius: var(--radius);
    box-shadow: 4px 4px 0 var(--indigo); padding: 22px; margin-bottom: 22px;
    display:flex; align-items:center; gap:16px;
  }
  .avatar{
    width:56px; height:56px; border-radius:50%; background:var(--indigo);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:1.4rem; flex:0 0 auto;
  }
  .id-name{ font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:1.15rem; }
  .id-email{ color:var(--ink-soft); font-size:0.85rem; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
  .stat-box{
    background:var(--surface); border:1.5px solid var(--ink); border-radius: var(--radius);
    box-shadow: 3px 3px 0 var(--terracotta); padding: 16px;
  }
  .stat-box .label{ font-size:0.8rem; color:var(--ink-soft); margin-bottom:6px; }
  .stat-box .value{ font-family:'Fraunces',serif; font-size:1.7rem; color:var(--accent-text); }

  .settings-list{
    background:var(--surface); border:1.5px solid var(--ink); border-radius: var(--radius);
    box-shadow: 4px 4px 0 var(--indigo); overflow:hidden;
  }
  .settings-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 16px 18px; border-bottom:1px solid var(--line); cursor:pointer;
    background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left; font-family:'Hind Siliguri',sans-serif; font-size:0.98rem; color:var(--ink);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row.danger{ color:var(--terracotta); }
  .settings-row .arrow{ color:var(--ink-soft); }
</style>
<script>
  if ((localStorage.getItem("vocabx_theme") || "light") === "dark"){
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
</head>
<body>

<div class="app">
  <div class="profile-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
      <a href="index.html" class="back-link" style="margin-bottom:0;">← অ্যাপে ফিরে যাও</a>
      <button class="theme-toggle-btn" id="themeToggleBtn" title="থিম বদলাও">🌙</button>
    </div>

    <div class="id-card">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <div class="id-name" id="profileName">লোড হচ্ছে...</div>
        <div class="id-email" id="profileEmail"></div>
      </div>
    </div>

    <div class="pstat-grid">
      <div class="pstat-card">
        <div class="pstat-icon streak">🔥</div>
        <div>
          <div class="pstat-label">স্ট্রিক</div>
          <div class="pstat-value" id="statStreak">০ দিন</div>
        </div>
      </div>
      <div class="pstat-card">
        <div class="pstat-icon words">📘</div>
        <div>
          <div class="pstat-label">শেখা শব্দ</div>
          <div class="pstat-value" id="statWords">০ / ০</div>
        </div>
      </div>
    </div>

    <div class="settings-list">
      <button class="settings-row" id="logoutRow">
        <span>লগআউট</span>
        <span class="arrow">→</span>
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span>হোম</a>
    <a href="index.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>শব্দ</a>
    <a href="sentences.html" class="nav-item"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>বাক্য</a>
    <a href="profile.html" class="nav-item is-active"><span class="nav-icon-wrap"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>প্রোগ্রেস</a>
  </nav>
</div>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("vocabx_theme") || "light";
    const btn = document.getElementById("themeToggleBtn");
    btn.textContent = saved === "dark" ? "☀️" : "🌙";
    btn.addEventListener("click", () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      if (isDark){
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("vocabx_theme", "light");
        btn.textContent = "🌙";
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("vocabx_theme", "dark");
        btn.textContent = "☀️";
      }
    });
  });
</script>
<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const MASTERED_AT = 4;

onAuthStateChanged(auth, async (user) => {
  if (!user){
    window.location.href = "login.html";
    return;
  }
  const snap = await getDoc(doc(db, "users", user.uid));
  const data = snap.exists() ? snap.data() : {};

  if (data.banned){
    await signOut(auth);
    alert("তোমার অ্যাকাউন্ট নিষিদ্ধ (ব্যান) করা হয়েছে।");
    window.location.href = "login.html";
    return;
  }

  const name = data.name || "ইউজার";

  document.getElementById("profileName").textContent = name;
  document.getElementById("profileEmail").textContent = user.email;
  document.getElementById("avatarInitial").textContent = name.trim().charAt(0).toUpperCase();

  loadStats(user.uid);
});

document.getElementById("logoutRow").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});

async function loadStats(uid){
  const progSnap = await getDoc(doc(db, "users", uid, "progress", "data"));
  const prog = progSnap.exists() ? progSnap.data() : { strength: {}, streak: 0 };

  document.getElementById("statStreak").textContent = toBn(prog.streak || 0) + " দিন";

  try{
    const res = await fetch("words.json");
    const words = await res.json();
    const masteredCount = words.filter(w => (prog.strength?.[String(w.id)] || 0) >= MASTERED_AT).length;
    document.getElementById("statWords").textContent = `${toBn(masteredCount)} / ${toBn(words.length)}`;
  }catch(e){
    document.getElementById("statWords").textContent = "—";
  }
}

function toBn(n){
  const digits = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  return String(n).split("").map(c => /[0-9]/.test(c) ? digits[c] : c).join("");
}
</script>
</body>
</html>
